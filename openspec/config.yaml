schema: spec-driven

context: |
  This repo is a Quarto blog. Its tutorials are post folders holding all their own
  artifacts: posts/fundamentals-of-mathematics-for-physicists/,
  posts/fundamentals-of-theoretical-physics/ and posts/kaluza-klein-theories/.
  Changes named kk-csdr-* and the specs bibliography, document-build,
  figure-generation, result-verification and tutorial-content belong to those
  tutorials. Older paths in them map as follows, inside the post that owns the
  chapter: tutorial/ is the post folder, KaluzaKlein/ and .veriphy/ are under
  lean/, sage/exercises/ is sage-exercises/, and references/ is _references/.
  All other paths are relative to the repo root.

