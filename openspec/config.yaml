schema: spec-driven

context: |
  This repo is a Quarto blog that also hosts a lecture-notes post in
  posts/_kaluza–klein-theories-and-coset-space-dimensional-reduction-lectures-with-verified-computations/.
  Changes named kk-csdr-* and the specs bibliography, document-build,
  figure-generation, result-verification and tutorial-content belong to that
  post: paths in them (scripts/, tutorial/, figures/, sage/, verification/,
  KaluzaKlein/, Makefile, references.bib) are relative to that directory, and
  their commands run from it. All other paths are relative to the repo root.

