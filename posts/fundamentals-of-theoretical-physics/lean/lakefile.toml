name = "kaluza_klein_physics"
defaultTargets = ["kaluza_klein_physics_lib"]

# `lake build` compiles the root module, as the book did. Modules it does not import are unfinished.
[[lean_lib]]
name = "kaluza_klein_physics_lib"
roots = ["KaluzaKleinPhysics", "KaluzaKlein.PartII", "KaluzaKlein.Foundations.Higgs", "KaluzaKlein.Foundations.Relativity", "KaluzaKlein.Foundations.Mechanics", "KaluzaKlein.Foundations.Actions", "KaluzaKlein.Foundations.Supergravity", "KaluzaKlein.Foundations.FieldTheory", "KaluzaKlein.Foundations.Supersymmetry", "KaluzaKlein.Foundations.Fields", "KaluzaKlein.Foundations.Primers"]
globs = ["KaluzaKleinPhysics"]

[[require]]
name = "kaluza_klein_mathematics"
path = "../../fundamentals-of-mathematics-for-physicists/lean"
