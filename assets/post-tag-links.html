<script>
// Turns the tags on a post page into links to the filtered Posts page.
document.addEventListener("DOMContentLoaded", () => {
  const postsLink = document.querySelector('.navbar a[href$="posts.html"]');
  if (!postsLink) {
    return;
  }
  const postsPage = postsLink.getAttribute("href");
  document.querySelectorAll(".quarto-categories .quarto-category").forEach((tag) => {
    const link = document.createElement("a");
    link.className = "tag-chip";
    link.textContent = tag.textContent;
    link.href = `${postsPage}#tag=${encodeURIComponent(tag.textContent.trim())}`;
    tag.replaceWith(link);
  });
});
</script>
